name: embe

services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy:version-v2.10.0
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      CSRF_TRUSTED_ORIGINS: http://localhost:${BABYBUDDY_PORT:-8000}
    volumes:
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/babybuddy
        target: /config
    ports:
      - 127.0.0.1:${BABYBUDDY_PORT:-8000}:8000
    networks:
      - embe-core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  memos:
    image: neosmemo/memos:0.30.0
    restart: unless-stopped
    environment:
      MEMOS_MODE: prod
      MEMOS_PORT: 5230
    volumes:
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/memos
        target: /var/opt/memos
    ports:
      - 127.0.0.1:${MEMOS_PORT:-5230}:5230
    networks:
      - embe-core
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5230/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  grocy:
    image: lscr.io/linuxserver/grocy:version-v4.7.0
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/grocy
        target: /config
    ports:
      - 127.0.0.1:${GROCY_PORT:-9283}:80
    networks:
      - embe-core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  node-red:
    image: nodered/node-red:5.0.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/node-red
        target: /data
    ports:
      - 127.0.0.1:${NODE_RED_PORT:-1880}:1880
    networks:
      - embe-core
    healthcheck:
      disable: false

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.3
    restart: unless-stopped
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/uptime-kuma
        target: /app/data
    ports:
      - 127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001
    networks:
      - embe-core
    healthcheck:
      disable: false

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    restart: unless-stopped
    profiles:
      - iot
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/infra/compose/mosquitto/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/secrets/runtime/mosquitto-passwordfile
        target: /mosquitto/config/password_file
        read_only: true
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/mqtt/data
        target: /mosquitto/data
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/mqtt/log
        target: /mosquitto/log
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    ports:
      - 127.0.0.1:${MQTT_PORT:-1883}:1883
    networks:
      - embe-core
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q [m]osquitto"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.1@sha256:6340a3de3917a9b19368e767310a96dd090f6a19aca8aeadf87fd1145cec9682
    restart: unless-stopped
    profiles:
      - iot
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - type: bind
        source: ${EMBE_ROOT:-C:/EmBe}/data/appdata/home-assistant
        target: /config
    ports:
      - 127.0.0.1:${HOME_ASSISTANT_PORT:-8123}:8123
    networks:
      - embe-core
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=3)\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s

networks:
  embe-core:
    name: embe-core
