services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    restart: unless-stopped
    profiles: ["media"]
    environment: &immich-environment
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in an untracked environment file}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - type: bind
        source: ${MEDIA_LOCATION:-C:/EmBe/data/media}
        target: /data
      - type: bind
        source: ${IMMICH_EXTERNAL_LIBRARY_PATH:-C:/Anh}
        target: /external-library/family
        read_only: true
    ports:
      - ${IMMICH_BIND_ADDRESS:-127.0.0.1}:${IMMICH_PORT:-2283}:2283
    networks:
      - embe-media
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    healthcheck:
      disable: false
    cpus: 1.25
    mem_limit: 3g

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    restart: unless-stopped
    profiles: ["media"]
    environment:
      <<: *immich-environment
      MACHINE_LEARNING_REQUEST_THREADS: 2
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 1
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: 1
      MACHINE_LEARNING_WORKERS: 1
      MACHINE_LEARNING_MODEL_TTL: 120
    volumes:
      - type: volume
        source: immich-model-cache
        target: /cache
    networks:
      - embe-media
    healthcheck:
      disable: false
    cpus: 0.5
    mem_limit: 1536m

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    restart: unless-stopped
    profiles: ["media"]
    networks:
      - embe-media
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    cpus: 0.25
    mem_limit: 256m

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    profiles: ["media"]
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in an untracked environment file}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - type: bind
        source: ${IMMICH_DB_DATA_LOCATION:-C:/EmBe/data/appdata/immich-postgres}
        target: /var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - embe-media
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$${POSTGRES_DB} --username=$${POSTGRES_USER} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: 1.0
    mem_limit: 1536m

networks:
  embe-media:
    name: embe-media

volumes:
  immich-model-cache:
