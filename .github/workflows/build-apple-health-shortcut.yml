name: Build Apple Health Shortcut

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_apple_health_shortcut.py
      - .github/workflows/build-apple-health-shortcut.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned shortcut
        run: python3 scripts/build_apple_health_shortcut.py "$RUNNER_TEMP/EmBe-Suc-khoe.shortcut"
      - name: Sign with Apple
        run: shortcuts sign --mode anyone --input "$RUNNER_TEMP/EmBe-Suc-khoe.shortcut" --output "$RUNNER_TEMP/EmBe-Suc-khoe.signed.shortcut"
      - uses: actions/upload-artifact@v4
        with:
          name: embe-apple-health-shortcut
          path: ${{ runner.temp }}/EmBe-Suc-khoe.signed.shortcut
          if-no-files-found: error
