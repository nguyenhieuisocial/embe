name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build

  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/storage-poc/pyproject.toml
      - run: pip install -e "services/storage-poc[test]" -e services/mcp-readonly -e services/procurement
      - run: pytest services/storage-poc/tests -q
      - run: python -m unittest discover -s services/local-bff/tests -v
      - run: PYTHONPATH=services/babybuddy-memos-sync/src python -m unittest discover -s services/babybuddy-memos-sync/tests -v
      - run: python -m unittest discover -s services/vault-export/tests -v
      - run: cd services/family-content && python -m unittest discover -s tests -v
      - run: cd services/analytics-ingest && python -m unittest discover -s tests -v
      - run: cd services/mcp-readonly && python -m unittest discover -s tests -v
      - run: cd services/reporting && python -m unittest tests.test_monthly_export -v
      - run: cd services/media-ingest && python -m unittest discover -s tests -v
      - run: python -m unittest discover -s services/procurement/tests -v
      - run: node --test scripts/health/tests/uptime-kuma-socket.test.js scripts/health/tests/portal-public-smoke.test.js

  windows-health-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify health, soak, and go-live gates
        shell: pwsh
        run: .\scripts\tests\health-gates.tests.ps1
