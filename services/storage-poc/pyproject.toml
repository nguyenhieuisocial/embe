[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "embe-storage-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.43.83",
  "cryptography==50.0.1",
  "cryptg==0.6.0",
  "fastapi==0.141.1",
  "python-multipart==0.0.31",
  "telethon==1.44.0",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embe_storage"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/0001_storage_poc.sql" = "embe_storage/migrations/0001_storage_poc.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
