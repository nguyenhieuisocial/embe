[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "embe-mcp-readonly"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.1.1",
]

[project.scripts]
embe-hoi = "embe_mcp.ask:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embe_mcp"]

