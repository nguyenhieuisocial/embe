[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "embe-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["av==18.1.0", "Pillow==12.3.0", "fastapi==0.141.1", "uvicorn==0.41.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1"]

[project.scripts]
embe-studio = "embe_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embe_studio"]
